baseURL: "https://aparnaagrawal02.github.io/aparna.github.io/"
title: "Aparna Agrawal"
theme: "PaperMod"

defaultContentLanguage: en
enableRobotsTXT: true
enableEmoji: true

# Allow raw HTML in markdown (used for publication cards and news items)
markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    style: github-dark
    lineNos: false
    codeFences: true
    guessSyntax: true
    tabWidth: 2

params:
  defaultTheme: auto
  ShowShareButtons: false
  ShowReadingTime: true
  disableSpecial1stPost: true
  ShowToggle: true
  TocOpen: false
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowPostNavLinks: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true

  profileMode:
    enabled: true
    title: "Aparna Agrawal"
    subtitle: >
      Engineering Analyst on the **NLP team at Goldman Sachs**. Previously,
      M.S. by Research at **IIIT Hyderabad (CVIT)** working on
      vision + language for sign-language synthesis. Interested in
      3D human motion generation and vision–language models.
    imageUrl: "images/aparna.jpeg"
    imageWidth: 240
    imageHeight: 240
    imageTitle: "Aparna Agrawal"
    # Buttons removed — top nav already exposes Publications / News / Blog / About / CV.

  socialIcons:
    - name: email
      url: "mailto:aparna.agrawal20@gmail.com"
    - name: github
      url: "https://github.com/AparnaAgrawal02"
    - name: linkedin
      url: "https://www.linkedin.com/in/aparna-agrawal-b502a4190/"
    - name: twitter
      url: "https://twitter.com/Aparna10401"
    - name: googlescholar
      url: "https://scholar.google.com/citations?user=zoMCXlcAAAAJ&hl=en"
    - name: rss
      url: "index.xml"

  assets:
    disableHLJS: true
    favicon: "images/favicon.ico"

menu:
  main:
    - identifier: publications
      name: Publications
      url: /publications/
      weight: 10
    - identifier: news
      name: News
      url: /news/
      weight: 20
    - identifier: blog
      name: Blog
      url: /blog/
      weight: 30
    - identifier: about
      name: About
      url: /about/
      weight: 40
    - identifier: cv
      name: CV
      url: cv.pdf
      weight: 50
