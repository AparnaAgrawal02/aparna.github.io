baseURL: "https://aparnaagrawal02.github.io/aparna.github.io/"
title: "Aparna Agrawal"
theme: "PaperMod"

defaultContentLanguage: en
enableRobotsTXT: true

# Allow raw HTML in markdown (used for publication cards and news items)
markup:
  goldmark:
    renderer:
      unsafe: true

params:
  defaultTheme: auto
  ShowShareButtons: false
  ShowReadingTime: true
  disableSpecial1stPost: true
  ShowToggle: true
  TocOpen: false
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true

  profileMode:
    enabled: true
    title: "Aparna Agrawal"
    subtitle: >
      Software Engineer on the **NLP team at Goldman Sachs**. Previously,
      M.S. by Research at **IIIT Hyderabad (CVIT)** working on
      vision + language for sign-language synthesis. Interested in deep
      learning for human-centric motion, vision–language models, and
      applied NLP.
    imageUrl: "images/aparna.jpeg"
    imageWidth: 240
    imageHeight: 240
    imageTitle: "Aparna Agrawal"
    buttons:
      - name: "Publications"
        url: "publications/"
      - name: "News"
        url: "news/"
      - name: "CV"
        url: "cv.pdf"

  socialIcons:
    - name: email
      url: "mailto:aparna.agrawal20@gmail.com"
    - name: github
      url: "https://github.com/AparnaAgrawal02"
    - name: linkedin
      url: "https://www.linkedin.com/in/aparna-agrawal-b502a4190/"
    # TODO: paste your Google Scholar profile URL, then uncomment:
    # - name: googlescholar
    #   url: "https://scholar.google.com/citations?user=YOUR_USER_ID"

menu:
  main:
    - identifier: publications
      name: Publications
      url: /publications/
      weight: 10
    - identifier: news
      name: News
      url: /news/
      weight: 20
    - identifier: about
      name: About
      url: /about/
      weight: 30
    - identifier: cv
      name: CV
      url: cv.pdf
      weight: 40
